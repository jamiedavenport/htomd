[tools]
python = "3.14.7"
uv = "0.12.11"
actionlint = "1.7.7"
node = "24.20.0"
bun = "1.4.2"
go = "1.27.1"
rust = "1.98.1"
"cargo:swb" = "0.3.0"

[env]
# Mise owns interpreter installation; uv owns the project environment and lockfile.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
