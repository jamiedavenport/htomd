[tools]
python = "3.14.7"
uv = "0.12.11"
actionlint = "1.7.7"

[env]
# Mise owns interpreter installation; uv owns the project environment and lockfile.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Install locked development dependencies"
run = "uv sync --locked"

[tasks.check]
description = "Check hooks, lint, formatting, types, and offline tests"
run = [
  "actionlint",
  "uv run --locked pre-commit validate-config",
  "uv run --locked ruff check .",
  "uv run --locked ruff format --check .",
  "uv run --locked mypy",
  "uv run --locked pytest",
]

[tasks.hooks]
description = "Run safe Ruff fixes and formatting through pre-commit"
run = "uv run --locked pre-commit run --all-files"

# Task tools keep the older CI interpreters in mise.lock.
[tasks."test:3.12"]
tools.python = "3.12.14"
run = "uv run --locked pytest"

[tasks."test:3.13"]
tools.python = "3.13.15"
run = "uv run --locked pytest"

[tasks.build]
description = "Build and validate release distributions"
run = ["uv build --no-sources", "uv run --locked python tools/check_dist.py"]
