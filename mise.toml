[tools]
python = "3.14.7"
uv = "0.12.11"
actionlint = "1.7.7"
node = "24.20.0"
bun = "1.4.2"
go = "1.27.1"
rust = "1.98.1"
"cargo:swb" = "0.2.0"

[env]
# Mise owns interpreter installation; uv owns the project environment and lockfile.
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[tasks.setup]
description = "Install locked development dependencies"
run = ["uv sync --directory python --locked", "bun install --cwd typescript --frozen-lockfile", "rustup component add rustfmt clippy", "cargo fetch --manifest-path rust/Cargo.toml --locked"]

[tasks.build]
description = "Build TypeScript and native CLIs from the checkout"
run = [
  "bun run --cwd typescript build",
  "go build -C go -trimpath -o bin/ ./cmd/htomd",
  "cargo build --manifest-path rust/Cargo.toml --release --locked --offline",
]

[tasks.test]
description = "Run native and integration tests after mise run build"
run = ["mise run test:python", "mise run test:typescript", "mise run test:go", "mise run test:rust", "mise run test:integration"]

[tasks."test:go"]
run = "go test -C go ./..."

[tasks."test:rust"]
run = "cargo test --manifest-path rust/Cargo.toml --locked --offline"

[tasks."test:python"]
description = "Run the Python test suite"
run = "uv run --directory python --locked pytest"

[tasks."test:typescript"]
description = "Test the built TypeScript package on Node"
run = "bun run --cwd typescript test"

[tasks."test:conformance"]
description = "Compare the Python environment and built CLIs on shared fixtures"
run = "uv run --project python --locked python -m tools.conformance"

[tasks."test:integration"]
description = "Run repository corpus and benchmark checks"
run = "uv run --project python --locked pytest tests"

[tasks.check]
description = "Run static checks, native tests, integration tests, and conformance"
run = ["mise run lint", "mise run test", "mise run test:conformance"]

[tasks.lint]
description = "Check formatting, lint, and types after building"
run = [
  "actionlint",
  "uv run --project python --locked pre-commit validate-config",
  "uv run --project python --locked ruff check .",
  "uv run --project python --locked ruff format --check .",
  "uv run --project python --locked mypy",
  "uv run --directory python --locked mypy",
  "bun run --cwd typescript lint",
  "bun run --cwd typescript format:check",
  "bun run --cwd typescript typecheck",
  "python -m tools.native lint-go",
  "cargo fmt --manifest-path rust/Cargo.toml --check",
  "cargo clippy --manifest-path rust/Cargo.toml --locked --offline --all-targets -- -D warnings",
  "python tools/generate_rust_entities.py --check",
]

[tasks.hooks]
description = "Run safe Ruff fixes and formatting through pre-commit"
run = "uv run --project python --locked pre-commit run --all-files"

# Task tools keep the older CI interpreters in mise.lock.
[tasks."test:3.12"]
tools.python = "3.12.14"
run = "uv run --directory python --locked pytest"

[tasks."test:3.13"]
tools.python = "3.13.15"
run = "uv run --directory python --locked pytest"

[tasks.release]
description = "Preview release preparation locally; publishing runs in GitHub Actions"
raw_args = true
run = "shipwright release --dry-run"

[tasks.benchmark]
description = "Build isolated environments and benchmark all 115 offline snapshots"
run = "python -m tools.benchmark.run"

[tasks."benchmark:smoke"]
description = "Build isolated environments and smoke-test every benchmark adapter"
run = "python -m tools.benchmark.run --smoke --output .benchmark/smoke.json"

[tasks."benchmark:report"]
description = "Generate the detailed report and README tables from saved measurements"
run = "python -m tools.benchmark.report tools/benchmark/results/macos-arm64.json --readme"
