# Repository tooling only; package metadata lives in python/ and typescript/.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
src = ["python/src", "."]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", "tools"]
exclude = ["tests/fixtures"]
