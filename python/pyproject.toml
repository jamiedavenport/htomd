[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "htomd"
version = "0.1.1"
description = "Focused Markdown and metadata from messy HTML, in pure Python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.scripts]
htomd = "htomd._cli:main"

[project.urls]
Repository = "https://github.com/jamiedavenport/htomd"
Issues = "https://github.com/jamiedavenport/htomd/issues"
Changelog = "https://github.com/jamiedavenport/htomd/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy==1.20.2",
  "pre-commit==4.5.1",
  "pytest==9.0.2",
  "ruff==0.15.6",
  "setuptools==82.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
htomd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Explicit branches are clearer for parser and renderer state transitions.
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures"]
