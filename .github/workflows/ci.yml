name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          # The shared UV_PYTHON environment template also requires Python.
          install_args: node bun python
      - run: bun install --cwd website --frozen-lockfile
      - run: bun run --cwd website build
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - run: mise run setup
      - run: mise run build
      - run: mise run lint
        if: runner.os == 'Linux'
      - run: mise run test
      - run: mise run test:conformance
      - name: Validate release versions
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python tools/check_release.py
      - run: mise run package
        if: github.event_name == 'release' && runner.os == 'Linux'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release' && runner.os == 'Linux'
        with:
          name: python-distributions
          path: dist/python/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release' && runner.os == 'Linux'
        with:
          name: typescript-distribution
          path: dist/typescript/
          if-no-files-found: error
      - run: mise run package:native
        if: github.event_name == 'release'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'release'
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/native/**/*.tar.gz
            dist/native/**/*.sha256
          if-no-files-found: error
  test-python:
    name: Test (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.15']
    runs-on: ubuntu-latest
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: python uv
      - run: mise run test:python
      - run: mise run test:integration
