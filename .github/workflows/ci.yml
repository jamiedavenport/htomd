name: CI
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          # The shared UV_PYTHON environment template also requires Python.
          install_args: node bun python
      - run: bun install --cwd website --frozen-lockfile
      - run: bun run --cwd website build
  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - run: mise run setup
      - run: mise run build
      - run: mise run lint
        if: runner.os == 'Linux'
      - run: mise run test
      - run: mise run test:conformance
  test-python:
    name: Test (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.15']
    runs-on: ubuntu-latest
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: python uv
      - run: mise run test:python
      - run: mise run test:integration
