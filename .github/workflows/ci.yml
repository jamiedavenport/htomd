name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - run: uv sync --locked
      - run: actionlint
      - run: uv run --locked pre-commit validate-config
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - run: uv sync --locked
      - run: mise run build
      - run: uv run --locked twine check dist/*
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12.14'}
          - {os: ubuntu-latest, python: '3.13.15'}
          - {os: ubuntu-latest, python: '3.14.7'}
          - {os: windows-latest, python: '3.14.7'}
          - {os: macos-latest, python: '3.14.7'}
    runs-on: ${{ matrix.os }}
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
      - run: uv sync --locked
      - run: uv run --locked pytest
