name: Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish ${{ matrix.package }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'release' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: python
            environment: pypi
          - package: typescript
            environment: npm
          - package: go
            environment: ''
          - package: rust
            environment: crates-io
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install_args: python uv node bun go rust cargo:swb
      - name: Validate the release tag and tested commit
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./typescript/package.json').version")"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - name: Install TypeScript dependencies
        if: matrix.package == 'typescript'
        run: bun install --cwd typescript --frozen-lockfile
      - name: Authenticate with crates.io
        if: matrix.package == 'rust'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish package and configured native downloads
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PACKAGE: ${{ matrix.package }}
        run: shipwright release "$PACKAGE"
